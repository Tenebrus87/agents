name: Greetings

# Automatic triggers paused on 2026-10-28 at owner's request.
# Restore the original trigger block below to re-enable automatic runs.
# on: [pull_request_target, issues]
on:
  workflow_dispatch:

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to Polymarket Agents. Thank you for filing your first issue."
        pr-message: "Welcome to Polymarket Agents. Thank you for creating your first PR. Cheers!"
